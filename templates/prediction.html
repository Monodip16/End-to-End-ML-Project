<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction | Scoreline</title>
    <style>
        :root { --ink: #17242d; --muted: #64727a; --paper: #f5f1e9; --accent: #e36d45; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
        .result { width: min(720px, 100%); padding: clamp(2rem, 7vw, 5rem); border-top: 8px solid var(--accent); background: #fffdf8; box-shadow: 0 18px 50px rgba(29, 57, 64, 0.1); }
        .eyebrow { color: var(--accent); font: 700 0.75rem Arial, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
        h1 { margin: 1.4rem 0 0.7rem; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 0.95; font-weight: 400; }
        p { color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }
        .score { margin: 2.5rem 0; color: var(--accent); font-size: clamp(4rem, 13vw, 8rem); line-height: 0.85; }
        .score span { color: var(--muted); font: 700 0.8rem Arial, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
        a { display: inline-block; padding: 0.95rem 1.25rem; color: #fff; background: #1d3940; text-decoration: none; font: 700 0.8rem Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
</head>
<body>
    <main class="result">
        <div class="eyebrow">Scoreline / Result</div>
        <h1>A considered estimate.</h1>
        {% if results is defined %}
            <p>Based on the profile you provided, the predicted math score is:</p>
            <div class="score">{{ results|round(1) }}<span> / 100</span></div>
        {% else %}
            <p>Your result will appear here after you submit a student profile.</p>
        {% endif %}
        <a href="/">Enter another profile →</a>
    </main>
</body>
</html>
